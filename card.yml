# The run, as steps for the agent. Run `steps` top to bottom; each `next` names the one after it.
# Every command runs from the root of this repo.
#
# Per step:
#   run        the one command for the step; nothing else is run for it
#   needs_yes  true: Steven approves this exact command at the permission prompt. A retry is a new yes.
#   human      a step only Steven does: show `note`, then wait for him to say it is done
#   detached   the command returns at once; then run `watch` again and again until a `success` or
#              `failure` string appears in its output
#   max_wall   report to Steven after this long; never kill a run
#   evidence   what goes in the step's report
#   on_failure a handler in `handlers`, or stop: report the line to Steven and do nothing else

card: cloudera-ce-ecs-aws
readme: README.md
never:
  - run ansible-navigator, terraform, aws or a playbook yourself; only the commands below
  - start a step while tmux session srmecs exists, or kill that session
  - delete AWS resources, or touch tf_cluster_aws/terraform.tfstate
  - create, copy or edit a license file
  - read, print or paste a password, the repo credentials or the Control Plane keys
  - run a needs_yes command that Steven has not approved

steps:
  - id: prereqs
    human: true
    note: >-
      Steven: Docker Desktop running; aws sso login --profile cldr-se ; the Mac on AC power with the lid
      open; the VPN in one state (connected or not) from here to the prove step.
    next: fork

  - id: fork
    run: git -C ~/Documents/GitHub/cloudera-ce-ecs-aws merge-base --is-ancestor 539f459 HEAD && echo "fork ok"
    needs_yes: false
    success: ["fork ok"]
    on_failure: stop
    next: preflight

  - id: preflight
    run: bash scripts/ecs-run.sh --check
    needs_yes: false
    success: ["preflight ok"]
    failure: ["PREFLIGHT FAILED:"]
    on_failure: stop
    next: deploy

  - id: deploy
    run: bash scripts/ecs-run.sh
    needs_yes: true           # about $6/h from here
    launched: ["launched: ansible-navigator run playbooks/infrastructure.yml"]
    detached: true
    watch: bash scripts/ecs-wait.sh
    success: ["RUN END", "status=successful"]
    success_all: true         # the RUN END line, not an older artifact
    failure: ["status=failed"]
    max_wall: 6h              # about 4 h of playbooks
    on_failure: diagnose
    evidence: the RUN END line, the last play and task, the PLAY RECAP lines
    next: cp-keys

  - id: cp-keys
    human: true
    note: >-
      Steven: open the ECS console URL that ecs-status.sh printed, log in as admin, then User Profile ->
      Generate Access Key, and write the three exports to ~/.config/ecs-aws/cp-keys.env (mode 600).
      README, The Control Plane keys.
    next: cai-preflight

  - id: cai-preflight
    run: bash scripts/ecs-run.sh --check cai-workbench
    needs_yes: false
    success: ["preflight ok"]
    failure: ["PREFLIGHT FAILED:"]
    on_failure: stop          # "not 44 characters" sends Steven back to the cp-keys step
    next: cai

  - id: cai
    run: bash scripts/ecs-run.sh cai-workbench
    needs_yes: true
    launched: ["launched: ansible-navigator run playbooks/cai-workbench.yml"]
    detached: true
    watch: bash scripts/ecs-wait.sh
    success: ["RUN END", "status=successful"]
    success_all: true         # the RUN END line, not an older artifact
    failure: ["status=failed"]
    max_wall: 1h              # about 11 min
    on_failure: diagnose
    evidence: the RUN END line
    next: done-check

  - id: done-check
    run: bash scripts/ecs-status.sh
    needs_yes: false
    success:
      - "cluster ozone-base-cluster: GOOD_HEALTH"
      - "cluster srmecs-ecs-cluster: GOOD_HEALTH"
      - "ECS console https://console-cdp.apps.ecs."
      - "AI Workbench https://"
    success_all: true         # every string present; the console line ends -> 302, the workbench -> 200
    on_failure: stop
    evidence: the whole output
    next: teardown

  - id: teardown
    run: bash scripts/ecs-teardown-and-prove.sh
    needs_yes: true
    launched: ["launched: infrastructure-teardown.yml"]
    detached: true
    watch: bash scripts/ecs-wait.sh
    success: ["TEARDOWN END", "clean"]
    success_all: true
    failure: ["LEFTOVERS"]
    max_wall: 30m             # about 5 min
    on_failure: stop          # leftovers are released or deleted by id only on Steven's yes
    evidence: the TEARDOWN END line
    next: prove

  - id: prove
    run: bash scripts/ecs-teardown-and-prove.sh --prove
    needs_yes: false
    success: ["EC2=0 EBS=0 VPC=0 EIP(tagged)=0 EIP(named)=0"]
    on_failure: stop
    evidence: the proof line
    next: end

handlers:
  - id: diagnose
    run: bash scripts/ecs-status.sh
    needs_yes: false
    note: >-
      Report the last play, task and fatal line to Steven, with the README "When it stops" row that
      matches, if one does. A resume is the failed playbook and every one after it, for example
      bash scripts/ecs-run.sh ecs-cluster , and needs Steven's yes. A failure with no matching row:
      report it, do not resume.
    next: stop
